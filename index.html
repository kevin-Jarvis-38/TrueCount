<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a2e1b">
<meta name="description" content="Blackjack-App zum Kartenzählen lernen (Hi-Lo)">
<title>TrueCount</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body data-screen="lobby">
<!-- Schatten für alle Zeichnungen -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="fx" x="-20%" y="-20%" width="150%" height="160%"><feFlood flood-color="#000" flood-opacity=".38"/><feComposite in2="SourceAlpha" operator="in"/><feOffset dx="2" dy="4" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>

<section id="lobby" class="screen">
  <header class="logo"><div><img class="tc" src="icons/icon-192.png" alt=""> True<b>Count</b></div><em id="admin-badge" hidden>ADMIN</em></header>
  <button class="pn profil" id="profil" data-l="profil" aria-label="Profil öffnen"></button>
  <div id="tischliste"></div>
  <nav class="nav">
    <button class="btn aux" data-l="tutorial">🦉 Tutorial</button>
    <button class="btn aux" data-l="training">🏋️ Training</button>
    <button class="btn aux" data-l="shop">🛍️ Shop</button>
    <button class="btn aux" data-l="erfolge">🏆 Erfolge</button>
    <button class="btn aux" data-l="optionen">⚙️ Optionen</button>
    <button class="btn aux" data-l="admin">🔑 Admin</button>
    <button class="btn aux" data-l="install" hidden>📲 Installieren</button>
  </nav>
</section>

<div id="app" class="screen" data-modus="setzen">
  <header id="hud">
    <div class="pn lvl"><span id="hud-ava"></span><div><b id="hud-level"></b> <small id="hud-titel"></small><div class="bar"><i id="hud-bar"></i></div></div></div>
    <div class="pn"><small>Pott</small><b id="hud-pott"></b><em id="hud-serie"></em></div>
    <div class="pn"><small>Guthaben</small><b id="geld"></b></div>
  </header>
  <main id="stage"><svg id="scene" preserveAspectRatio="xMidYMid meet"></svg></main>
  <section id="aux">
    <p class="pn tip" id="tip"></p>
    <button class="btn aux info" data-a="info" hidden aria-label="Professor Uhu fragen">i</button>
    <button class="btn aux z" data-a="aufgeben">Aufgeben<small>Surrender</small></button>
    <button class="btn aux s" data-a="aufstehen">Aufstehen<small>Pott sichern</small></button>
    <button class="btn aux" data-a="optionen">Optionen<small>Schuh · Ton</small></button>
  </section>
  <section id="main">
    <button class="btn hit z" data-a="karte">Karte<small>Hit</small></button>
    <button class="btn stand z" data-a="bleiben">Bleiben<small>Stand</small></button>
    <button class="btn dbl z" data-a="verdoppeln">Verdoppeln<small>Double</small></button>
    <button class="btn split z" data-a="teilen">Teilen<small>Split</small></button>
    <button class="btn aux s" data-a="einsatz">Einsatz<small id="betlbl"></small></button>
    <button class="btn hit s" data-a="austeilen"><span id="deallbl">Austeilen</span><small>Deal</small></button>
  </section>
</div>

<section id="training" class="screen"><div id="tr"></div></section>

<div id="toast" class="pn"></div>
<div class="ov" id="ov"><div class="pn sheet" id="sheet"></div></div>
<div id="uhu"></div>
</body>
</html>
