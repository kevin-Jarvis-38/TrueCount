<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a2e1b">
<title>TrueCount</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app" data-modus="setzen">
  <header id="hud">
    <div class="pn tisch"><b id="tischname">Hinterzimmer</b><small id="tischlimit"></small></div>
    <div class="pn"><small>Einsatz</small><b id="einsatz"></b></div>
    <div class="pn"><small>Guthaben</small><b id="geld"></b></div>
  </header>
  <main id="stage"><svg id="scene" preserveAspectRatio="xMidYMid meet"></svg></main>
  <section id="aux">
    <p class="pn tip" id="tip"></p>
    <button class="btn aux" data-a="aufgeben">Aufgeben<small>Surrender</small></button>
    <button class="btn aux" data-a="optionen">Optionen<small>Schuh · Tempo</small></button>
  </section>
  <section id="main">
    <button class="btn hit z" data-a="karte">Karte<small>Hit</small></button>
    <button class="btn stand z" data-a="bleiben">Bleiben<small>Stand</small></button>
    <button class="btn dbl z" data-a="verdoppeln">Verdoppeln<small>Double</small></button>
    <button class="btn split z" data-a="teilen">Teilen<small>Split</small></button>
    <button class="btn aux s" data-a="einsatz">Einsatz<small id="betlbl"></small></button>
    <button class="btn hit s" data-a="austeilen"><span id="deallbl">Austeilen</span><small>Deal</small></button>
  </section>
</div>
<div id="toast" class="pn"></div>

<div class="ov" id="ov-bet"><div class="pn sheet">
  <h2>Einsatz</h2>
  <p id="bet-info"></p>
  <div class="pile" id="bpile"></div>
  <div class="bsum" id="bsum"></div>
  <div class="chips" id="chips"></div>
  <div class="row"><button class="btn aux" data-b="undo">↩ Zurück</button><button class="btn aux" data-b="clear">Leeren</button><button class="btn hit" data-b="ok">✓ Setzen</button></div>
</div></div>

<div class="ov fest" id="ov-vers"><div class="pn sheet">
  <h2>Versicherung?</h2>
  <p>Der Dealer zeigt ein <b>Ass</b>. Die Versicherung kostet <b id="vers-preis"></b> und zahlt 2 zu 1, wenn er Blackjack bekommt.</p>
  <div class="row zwei"><button class="btn aux" data-v="0">Nein</button><button class="btn hit" data-v="1">Ja, versichern</button></div>
</div></div>

<div class="ov" id="ov-opt"><div class="pn sheet">
  <h2>Optionen</h2>
  <div class="opt"><span>Decks im Schuh</span><button class="btn aux" data-o="decks:-1">−</button><b id="o-decks"></b><button class="btn aux" data-o="decks:1">+</button></div>
  <div class="opt"><span>Schnittkarte</span><button class="btn aux" data-o="schnitt:-1">−</button><b id="o-schnitt"></b><button class="btn aux" data-o="schnitt:1">+</button></div>
  <div class="opt"><span>Tempo</span><button class="btn aux" data-o="tempo:-1">−</button><b id="o-tempo"></b><button class="btn aux" data-o="tempo:1">+</button></div>
  <p>Ändert sich der Schuh, mischt der Dealer sofort einen neuen.</p>
  <div class="row zwei"><span></span><button class="btn hit" data-zu="1">Fertig</button></div>
</div></div>
</body>
</html>
